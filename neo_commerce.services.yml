services:
  neo_commerce.settings:
    parent: neo_settings.repository
    arguments: ['neo_commerce']

  neo_commerce.cart_lazy_builders:
    class: Drupal\neo_commerce\Cart\CartLazyBuilders
    arguments:
      - '@neo_commerce.settings'
      - '@commerce_cart.cart_provider'
      - '@entity_type.manager'

  neo_commerce.cart_response:
    class: Drupal\neo_commerce\Ajax\CartResponseBuilder
    arguments:
      - '@neo_commerce.settings'
      - '@neo_commerce.cart_lazy_builders'
      - '@event_dispatcher'
      - '@messenger'
      - '@request_stack'
      - '@entity_type.manager'
      - '@string_translation'

  neo_commerce.add_to_cart:
    class: Drupal\neo_commerce\Cart\AddToCartFormAlter
    arguments:
      - '@neo_commerce.settings'
      - '@entity_type.manager'
      - '@event_dispatcher'
      - '@string_translation'

  neo_commerce.cart_form:
    class: Drupal\neo_commerce\Cart\CartFormAlter
    arguments:
      - '@neo_commerce.settings'
      - '@event_dispatcher'
      - '@string_translation'

  neo_commerce.selected_variation:
    class: Drupal\neo_commerce\Product\SelectedVariation
    arguments:
      - '@entity_type.manager'

  neo_commerce.product_card_builder:
    class: Drupal\neo_commerce\Product\ProductCardBuilder
    arguments:
      - '@neo_commerce.settings'
      - '@entity_type.manager'
      - '@commerce_price.currency_formatter'

  neo_commerce.related_products:
    class: Drupal\neo_commerce\Product\RelatedProducts
    arguments:
      - '@neo_commerce.settings'
      - '@entity_type.manager'

  neo_commerce.product_categories:
    class: Drupal\neo_commerce\Product\ProductCategories
    arguments:
      - '@neo_commerce.settings'
      - '@entity_type.manager'
      - '@entity_field.manager'

  neo_commerce.variation_field_renderer:
    class: Drupal\neo_commerce\Product\VariationFieldRenderer
    arguments:
      - '@entity_type.manager'
      - '@entity_display.repository'

  neo_commerce.variation_field_slot_subscriber:
    class: Drupal\neo_commerce\EventSubscriber\VariationFieldSlotSubscriber
    arguments:
      - '@config.factory'
      - '@neo_commerce.variation_field_renderer'
    tags:
      - { name: event_subscriber }

  neo_commerce.product_breadcrumb:
    class: Drupal\neo_commerce\Breadcrumb\ProductBreadcrumbBuilder
    arguments:
      - '@neo_commerce.settings'
      - '@entity_type.manager'
      - '@entity_field.manager'
    tags:
      # Ahead of menu_breadcrumb (1010) and taxonomy's term builder (1002).
      - { name: breadcrumb_builder, priority: 1050 }

  neo_commerce.variation_rerender_subscriber:
    class: Drupal\neo_commerce\EventSubscriber\VariationRerenderSubscriber
    arguments:
      - '@neo_commerce.selected_variation'
      - '@entity_field.manager'
      - '@renderer'
      - '@request_stack'
    tags:
      - { name: event_subscriber }

  logger.channel.neo_commerce:
    parent: logger.channel_base
    arguments: ['neo_commerce']

  # Hook classes are registered by their class name, which is the service id
  # core's HookCollectorPass looks for. Declaring them keeps their arguments
  # explicit like the rest of the family rather than autowired.
  Drupal\neo_commerce\Hook\FormHooks:
    class: Drupal\neo_commerce\Hook\FormHooks
    arguments:
      - '@neo_commerce.add_to_cart'
      - '@neo_commerce.cart_form'

  Drupal\neo_commerce\Hook\ThemeHooks:
    class: Drupal\neo_commerce\Hook\ThemeHooks

  Drupal\neo_commerce\Hook\ProductHooks:
    class: Drupal\neo_commerce\Hook\ProductHooks
    arguments:
      - '@neo_commerce.selected_variation'
      - '@neo_commerce.product_card_builder'

  Drupal\neo_commerce\Hook\InstallHooks:
    class: Drupal\neo_commerce\Hook\InstallHooks
    arguments:
      - '@neo_alchemist.theme_component_installer'
