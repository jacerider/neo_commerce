$schema: 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: 'Checkout | Page'
status: stable
description: 'The single-page checkout: a page head, the details, shipping and payment sections with Place order, and a sticky order summary that folds into a bar on phones. Rendered by neo_commerce around Commerce''s checkout form for flows using the neo_single_page plugin.'
# Source template. `neo: false` keeps this module copy out of the component
# picker; `neo_install: true` has neo_alchemist copy it into the front theme on
# install, flipping the copy to `neo: true`. The theme copy is the one you
# restyle. Strip `neo_install` from that copy: the installer flips `neo` but
# leaves the key behind, and a stale one trips drush neo:alchemist:validate.
neo: false
neo_install: true
props:
  type: object
  properties:
    kicker:
      type: string
      title: Kicker
      examples: ['Market Checkout']
    title:
      type: string
      title: Title
      description: 'The page heading, printed with title_tag. Hide the theme''s page title block on checkout pages so the page has one H1.'
      examples: ['Shipping & Payment']
    title_tag:
      type: string
      title: 'Title tag'
      enum: [h1, h2]
      examples: [h1]
    intro:
      type: string
      title: Intro
      examples: ['Pantry, bakery & cellar goods, ready right away.']
    summary_title:
      type: string
      title: 'Summary heading'
      examples: ['Order Summary']
    summary_toggle_label:
      type: string
      title: 'Summary toggle label'
      description: 'The bar that opens the summary on phones. The total follows it.'
      examples: ['Show order summary']
    secure_note:
      type: string
      title: 'Secure note'
      description: 'Under Place order.'
      examples: ['Encrypted & secure']
    total:
      type: string
      title: Total
      description: 'The order total, formatted, for the summary bar on phones.'
      examples: ['$171.90']
slots:
  errors:
    title: Errors
    description: 'The error summary the save and Place order fill. MUST be printed: it is where the errors land, and where focus goes when there are some.'
  details:
    title: 'Your details'
    description: 'The contact pane: email, and log in for guests.'
  shipping:
    title: Shipping
    description: 'Commerce Shipping''s pane: the shipping address and the shipping method. Empty when the order has nothing to ship.'
  payment:
    title: Payment
    description: 'The payment information pane (payment method, billing address) and the gateway''s own pane, such as Stripe''s card form.'
  extra:
    title: 'Other panes'
    description: 'Any other pane a site put on the page, in its order.'
  actions:
    title: Actions
    description: 'Place order. MUST be printed, inside the form markup this component sits in.'
  summary:
    title: Summary
    description: 'The sidebar panes: the order summary, coupon and gift card.'
